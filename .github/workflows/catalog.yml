name: Catálogo de rolês

# - PRs that touch the catalog are validated.
# - PRs opened by the update routine (branch catalog/* or claude/catalog-*) that only
#   change catalog/*.json are imported into Firestore and merged automatically.
#   Routine rolês land as `pending` and are approved in the app's Curadoria screen.
# - Pushes to master (manual edits) are imported too.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'catalog/**'
      - 'scripts/catalog/**'
  push:
    branches: [master]
    paths:
      - 'catalog/**'
      - 'scripts/catalog/**'
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar catálogo
        working-directory: scripts/catalog
        run: node import.mjs --dry-run

  routine:
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'catalog/') || startsWith(github.head_ref, 'claude/catalog-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Conferir que o PR só altera o catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only)
          echo "$files"
          if echo "$files" | grep -vqE '^catalog/[a-z0-9-]+\.json$'; then
            echo "::error::PR da rotina altera arquivos fora de catalog/*.json; precisa de revisão manual."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar firebase-admin
        working-directory: scripts/catalog
        run: npm install --no-audit --no-fund
      - name: Importar no Firestore
        working-directory: scripts/catalog
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT não configurado no repositório."
            exit 1
          fi
          node import.mjs
      - name: Fazer merge do PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --merge

  import:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar firebase-admin
        working-directory: scripts/catalog
        run: npm install --no-audit --no-fund
      - name: Importar no Firestore
        working-directory: scripts/catalog
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT não configurado no repositório."
            exit 1
          fi
          node import.mjs
